plugins {
    id 'com.android.application'
}

// AGP 9 内置 Kotlin 支持，无需再应用 org.jetbrains.kotlin.android 插件。
android {
    namespace 'com.caipiao.app'
    compileSdk 37

    defaultConfig {
        applicationId "com.caipiao.app"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
