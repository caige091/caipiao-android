<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>福彩开奖模拟器 · 双色球 / 福彩3D</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23e8392e'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23fff' font-family='sans-serif'>奖</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-logo">奖</span>
        <div>
          <h1>福彩开奖模拟器</h1>
          <p>自动获取开奖 · 倍投选号 · 账本统计</p>
        </div>
      </div>
      <div class="header-status" id="headerStatus">正在获取开奖数据…</div>
    </div>
  </header>

  <main class="wrap">
    <!-- 彩种切换 -->
    <div class="game-tabs" role="tablist">
      <button class="game-tab active" data-game="ssq" role="tab">双色球</button>
      <button class="game-tab" data-game="3d" role="tab">福彩3D</button>
    </div>

    <!-- 页面级切换：开奖 / 投注 / 账本 / 中奖规则 -->
    <div class="page-tabs">
      <button class="page-tab active" data-page="draw">开奖</button>
      <button class="page-tab" data-page="bet">投注</button>
      <button class="page-tab" data-page="ledger">账本</button>
      <button class="page-tab" data-page="rules">中奖规则</button>
    </div>

    <!-- ========== 开奖页 ========== -->
    <section class="page-section" data-page="draw">
      <!-- 最新开奖 -->
      <div class="card draw-card">
        <div class="card-head">
          <h2>最新开奖</h2>
          <div class="draw-meta">
            <span id="drawIssue">--</span>
            <span id="drawDate">--</span>
            <button class="btn-ghost" id="btnRefresh" title="重新拉取开奖数据">刷新</button>
          </div>
        </div>
        <div class="draw-balls" id="drawBalls"></div>
        <div class="draw-stats" id="drawStats"></div>
        <div class="prize-table-wrap">
          <table class="prize-table" id="prizeTable"></table>
        </div>
        <p class="tip" id="scheduleTip"></p>
      </div>

      <!-- 近期开奖 -->
      <div class="card">
        <div class="card-head">
          <h2>近 10 期开奖</h2>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
    </section>

    <!-- ========== 投注页 ========== -->
    <section class="page-section" data-page="bet" hidden>
      <!-- 选号区 -->
      <div class="card">
        <div class="card-head">
          <h2 id="pickerTitle">我的选号</h2>
          <div class="head-actions">
            <span class="picker-issue-tag" id="pickerIssue">--</span>
            <button class="btn-secondary" id="btnRandom">机选一注</button>
            <button class="btn-ghost" id="btnClearPicker">清空</button>
          </div>
        </div>
        <div id="pickerArea"></div>
        <div class="picker-footer">
          <span class="tip" id="pickerTip"></span>
          <button class="btn-primary" id="btnAddBet">加入我的投注</button>
        </div>
      </div>

      <!-- 待开奖投注 -->
      <div class="card">
        <div class="card-head">
          <h2>我的投注 · 待结算</h2>
          <div class="head-actions">
            <span class="picker-issue-tag" id="betIssueTag">--</span>
            <span class="bet-count" id="betCount">共 0 注</span>
          </div>
        </div>
        <div class="bet-list" id="betList"></div>
        <div class="empty-tip" id="emptyTip">还没有投注，先在上面选号或机选一注吧～</div>
      </div>
    </section>

    <!-- ========== 账本页 ========== -->
    <section class="page-section" data-page="ledger" hidden>
      <div class="card">
        <div class="card-head">
          <h2>我的账本</h2>
          <div class="head-actions" id="ledgerFilter"></div>
        </div>
        <div class="ledger-overview" id="ledgerOverview"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>每期明细</h2></div>
        <div class="ledger-detail" id="ledgerDetail"></div>
      </div>
    </section>

    <section class="page-section" data-page="rules" hidden>
      <div class="card">
        <div class="card-head"><h2 id="rulesTitle">中奖规则</h2></div>
        <p class="rules-intro" id="rulesIntro"></p>
        <div class="prize-table-wrap">
          <table class="prize-table rules-table" id="rulesTable" aria-label="中奖条件与单注奖金"></table>
        </div>
        <div class="rules-notes" id="rulesNotes"></div>
        <p class="rules-source" id="rulesSource"></p>
      </div>
    </section>

    <footer class="site-footer">
      <p>数据来源：中国福利彩票官网（cwl.gov.cn），每 5 分钟自动刷新。投注后开奖结果自动结算入账本。</p>
      <p>本页面仅供学习娱乐，模拟奖金不作为兑奖依据。理性购彩，量力而行。</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
